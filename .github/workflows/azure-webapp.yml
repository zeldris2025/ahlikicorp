# Deploys the CODE ONLY to Azure App Service on every push to main.
#
# The package is built with `git archive`, which contains only files committed
# to git. db.sqlite3, media/, staticfiles/, .env and venv/ are in .gitignore,
# so they can never be uploaded — the live database and uploads on Azure
# (in /home/data) are left untouched by every deploy.
name: Deploy to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ahlikicorp   # <-- change to your App Service name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package code only (no database, no media)
        run: |
          git archive --format=zip -o app.zip HEAD
          if unzip -l app.zip | grep -qE 'db\.sqlite3|(^|\s)media/'; then
            echo "Refusing to deploy: database or media found in package" && exit 1
          fi

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip
