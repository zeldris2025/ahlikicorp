# Local hosting: the site is served by nginx on http://localhost:8080.
# Settings for the containers live in .env.docker (not committed).
#
#   docker compose up -d --build     start / rebuild after code changes
#   docker compose logs -f web       follow the app log
#   docker compose down              stop (data is kept in the volumes)

services:
  db:
    image: postgres:16-alpine
    container_name: ahlikicorp_db
    env_file: .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ahlikicorp_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    container_name: ahlikicorp_web
    env_file: .env.docker
    environment:
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      # Uploaded images live on the host, so they survive rebuilds.
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ahlikicorp_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
