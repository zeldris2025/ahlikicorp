{% extends 'base.html' %}
{% block title %}My Profile | Ah Liki{% endblock %}
{% block content %}
<section class="max-w-3xl mx-auto px-4 py-16">
    <h1 class="section-heading">My profile</h1>
    <form method="post" class="bg-gray-50 border rounded-lg p-7 space-y-7">
        {% csrf_token %}
        <div class="grid md:grid-cols-2 gap-5">{% for field in user_form %}<div><label class="block font-semibold mb-2">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div>
        <div class="border-t pt-6 grid md:grid-cols-2 gap-5">{% for field in profile_form %}<div><label class="block font-semibold mb-2">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div>
        <button class="btn-primary" type="submit">Save profile</button>
    </form>
</section>
{% endblock %}
