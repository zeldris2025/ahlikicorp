{% extends 'base.html' %}
{% block title %}Quote Received | Ah Liki{% endblock %}
{% block content %}<section class="max-w-2xl mx-auto px-4 py-20 text-center"><div class="bg-teal-50 border border-teal-200 rounded-lg p-10"><p class="text-teal-700 font-semibold uppercase">Request received</p><h1 class="brand-font text-3xl text-blue-950 mt-3">Thank you, {{ quote.customer_name }}</h1><p class="text-gray-600 mt-4">Your reference is <strong>{{ quote.reference }}</strong>. We sent confirmation to {{ quote.email }}.</p><a href="{% url 'products:list' %}" class="btn-primary mt-7">Continue browsing</a></div></section>{% endblock %}
