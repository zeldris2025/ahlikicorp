{% extends 'base.html' %}
{% block title %}Update {{ object.reference }} | Ah Liki{% endblock %}
{% block content %}<section class="max-w-2xl mx-auto px-4 py-14"><h1 class="section-heading">Update {{ object.reference }}</h1><form method="post" class="bg-gray-50 border rounded-lg p-7 space-y-5">{% csrf_token %}{% for field in form %}<div><label class="block font-semibold mb-2">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button class="btn-primary" type="submit">Save quote</button></form></section>{% endblock %}
